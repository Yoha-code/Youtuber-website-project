<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join The Syndicate | Technoblade Newsletter</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        technoRed: '#E53E3E',
                        technoDarkRed: '#9B2C2C',
                        technoBlack: '#0D0D0D',
                        technoGray: '#1A1A1A',
                    },
                    boxShadow: {
                        'glow-red': '0 0 25px rgba(229, 62, 62, 0.6)',
                        'glow-sm': '0 0 10px rgba(229, 62, 62, 0.4)',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-technoBlack text-gray-200 font-sans antialiased selection:bg-technoRed selection:text-white flex flex-col min-h-screen">

    <!-- Navigation Bar -->
    <nav class="fixed top-0 left-0 w-full bg-technoBlack/90 backdrop-blur-md border-b border-technoDarkRed/40 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-2">
                <span class="text-2xl font-black italic tracking-wider text-technoRed drop-shadow-glow-sm">TECHNOBLADE</span>
            </a>
            <div class="flex items-center space-x-6 text-sm font-semibold tracking-wide uppercase">
                <a href="/" class="hover:text-technoRed transition-colors">&#8592; Back To Hub</a>
            </div>
        </div>
    </nav>

    <!-- Main Newsletter Container -->
    <main class="flex-grow flex items-center justify-center pt-28 pb-16 px-4">
        <div class="relative max-w-xl w-full bg-gradient-to-b from-technoGray to-technoBlack border border-technoRed/50 rounded-2xl p-8 sm:p-12 shadow-glow-red overflow-hidden">
            <!-- Background Radial Glow -->
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-technoRed/20 rounded-full blur-3xl pointer-events-none"></div>

            <div class="text-center mb-8">
                <span class="inline-block px-3 py-1 bg-technoRed/20 border border-technoRed/40 text-technoRed text-xs font-bold uppercase tracking-widest rounded-full mb-3">
                    Exclusive Access
                </span>
                <h1 class="text-4xl sm:text-5xl font-black italic tracking-wider text-white uppercase mb-2">
                    JOIN THE <span class="text-technoRed drop-shadow-glow-sm">SYNDICATE</span>
                </h1>
                <p class="text-gray-400 text-sm max-w-sm mx
